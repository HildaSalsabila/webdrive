<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buat Akun Guru - Web Drive Tugas Python</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-body" data-page="setup" data-public="true">
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">🎓</div>
        <h1>Buat akun guru</h1>
        <p class="auth-sub">Dilakukan sekali saja. Setelah akun guru ada, halaman ini tidak bisa dipakai lagi.</p>

        <div id="flash" class="flash" style="display:none;"></div>

        <div id="setupDone" style="display:none;">
            <p>Akun guru sudah dibuat. Silakan masuk, lalu hapus file <b>setup_guru.html</b> dan <b>setup_guru.php</b> dari folder project.</p>
            <a href="login.html" class="btn btn-primary btn-block" style="text-align:center;">Ke halaman masuk</a>
        </div>

        <form id="setupForm">
            <div class="form-group">
                <label for="name">Nama guru</label>
                <input type="text" id="name" required autofocus>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" autocomplete="username" required>
                <p class="hint">Huruf kecil, angka, titik, atau garis bawah (3-30 karakter).</p>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="new-password" required minlength="6">
            </div>
            <div class="form-group">
                <label for="password2">Ulangi password</label>
                <input type="password" id="password2" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="setupBtn">Buat akun guru</button>
        </form>
    </div>
</div>
<script src="common.js"></script>
<script src="auth.js"></script>
</body>
</html>
