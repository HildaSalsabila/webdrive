<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar Murid - Web Drive Tugas Python</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body class="auth-body" data-page="register" data-public="true">
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Daftar akun murid</h1>
        <p class="auth-sub">Akun ini dipakai untuk mengumpulkan tugas.</p>

        <div id="flash" class="flash" style="display:none;"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Nama lengkap</label>
                <input type="text" id="name" autocomplete="name" required autofocus>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" autocomplete="username" required>
                <p class="hint">Huruf kecil, angka, titik, atau garis bawah (3-30 karakter).</p>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="new-password" required minlength="6">
                <p class="hint">Minimal 6 karakter.</p>
            </div>
            <div class="form-group">
                <label for="password2">Ulangi password</label>
                <input type="password" id="password2" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="registerBtn">Buat akun</button>
        </form>

        <p class="auth-switch">Sudah punya akun? <a href="login.html">Masuk</a></p>
    </div>
</div>
<script src="common.js"></script>
<script src="auth.js"></script>
</body>
</html>
