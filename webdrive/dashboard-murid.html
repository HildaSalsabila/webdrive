<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Murid - Web Drive Tugas Python</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body class="dashboard-murid-page">

<header>
    <h1>Dashboard Murid</h1>
    <div class="header-right">
        <span class="user-chip">👤 <span id="userName">...</span></span>
        <button class="btn btn-logout" id="logoutBtn">Keluar</button>
    </div>
</header>

<main>
    <div id="flash" class="flash" style="display:none;"></div>

    <div class="card">
        <h2>Kumpulkan tugas</h2>
        <form class="upload-form" id="uploadForm">
            <div class="form-group upload-file-group">
                <label for="pyfile">File Python (.py, maksimal 5 MB)</label>
                <input type="file" id="pyfile" accept=".py" required>
            </div>
            <div class="form-group">
                <label for="description">Keterangan tugas</label>
                <input type="text" id="description" placeholder="Contoh: Tugas 3 - Looping (opsional)">
            </div>
            <div class="form-group upload-submit-group">
                <button type="submit" class="btn btn-primary" id="uploadBtn">⬆ Unggah</button>
            </div>
        </form>
    </div>

    <div class="card">
        <h2>Tugas yang sudah kamu kumpulkan <span id="summary" style="color:#8a8a8a;font-size:13px;font-weight:400;"></span></h2>
        <div id="tableWrapper"><p class="empty">Memuat data...</p></div>
        <p class="hint">Tugas yang sudah diperiksa guru tidak bisa dihapus lagi.</p>
    </div>
</main>

<script src="common.js"></script>
<script src="murid.js"></script>
</body>
</html>
