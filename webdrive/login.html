<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk - Web Drive Tugas Python</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body class="auth-body" data-page="login" data-public="true">
<div class="auth-wrap">
    <div class="auth-card">
<h1>Drive</h1>
        <p class="auth-sub">Masuk untuk mengumpulkan atau memeriksa tugas.</p>

        <div id="flash" class="flash" style="display:none;"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Masuk</button>
        </form>

        <p class="auth-switch">Belum punya akun? <a href="register.html">Daftar sebagai murid</a></p>
    </div>
</div>
<script src="common.js"></script>
<script src="auth.js"></script>
</body>
</html>
